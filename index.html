<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator craftingu</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#dcdcd6;--ac:#c2410c;--ok:#15803d;--bad:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--tx:#ececE8;--mu:#9a9a94;--bd:#363633;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--tx:#ececE8;--mu:#9a9a94;--bd:#363633;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font-size:15px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px 9px;min-width:0}
input[type=number]{width:84px}
button.s{font:inherit;padding:7px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.s.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.x{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row input[type=text]{flex:1}
.big{font-size:34px;font-weight:700;line-height:1}
.mu{color:var(--mu);font-size:14px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:13px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
</style>
</head>
<body>
<main>
<h1>Kalkulator craftingu</h1>
<nav>
<button id="t0" onclick="tab(0)">Podsumowanie</button>
<button id="t1" onclick="tab(1)">Magazyn</button>
<button id="t2" onclick="tab(2)">Receptury</button>
</nav>
<section id="v0"></section>
<section id="v1" hidden></section>
<section id="v2" hidden></section>
<datalist id="dl"></datalist>
</main>
<script>
var K='craftcalc1';
var SAMPLE={mats:[{n:'Żelazo',q:23},{n:'Skóra',q:7},{n:'Drewno',q:30},{n:'Nić',q:5}],
recipes:[{n:'Miecz (przykład)',w:1,i:[{n:'Żelazo',q:5},{n:'Skóra',q:2}]},{n:'Łuk (przykład)',w:1,i:[{n:'Drewno',q:6},{n:'Nić',q:3}]}]};
var S=load(),cur=0;
function load(){try{var r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}return JSON.parse(JSON.stringify(SAMPLE))}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function have(n){var k=n.trim().toLowerCase();for(var m of S.mats)if(m.n.trim().toLowerCase()==k)return m.q;return 0}
function ensure(n){n=n.trim();if(!n)return;var k=n.toLowerCase();if(!S.mats.some(m=>m.n.trim().toLowerCase()==k))S.mats.push({n:n,q:0})}
function tab(i){cur=i;for(var k=0;k<3;k++){document.getElementById('v'+k).hidden=k!=i;document.getElementById('t'+k).className=k==i?'on':''}
[sum,stock,recipes][i]();
document.getElementById('dl').innerHTML=S.mats.map(m=>'<option value="'+esc(m.n)+'">').join('')}

function sum(){
var h='';
if(!S.recipes.length)h='<div class="card mu">Brak receptur. Dodaj je w zakładce Receptury.</div>';
S.recipes.forEach(function(r,ri){
var rows='',max=Infinity,lim='';
r.i.forEach(function(g){
var q=+g.q||0,hv=have(g.n);
if(q<=0||!g.n.trim())return;
var c=Math.floor(hv/q);
if(c<max){max=c;lim=g.n}
rows+='<tr><td>'+esc(g.n)+'</td><td>'+q+'</td><td>'+hv+'</td><td>'+c+' szt.</td><td id="m'+ri+'_'+esc(g.n)+'"></td></tr>'});
if(max===Infinity)max=0;
h+='<div class="card"><div class="hd"><div><b>'+esc(r.n)+'</b><div class="mu">Wystarczy na:</div><div class="big '+(max>0?'ok':'bad')+'">'+max+' szt.</div>'+
(max===0&&lim?'<div class="mu">Brakuje: '+esc(lim)+'</div>':(lim?'<div class="mu">Ogranicza: '+esc(lim)+'</div>':''))+'</div>'+
'<div class="mu">Chcę zrobić:<br><input type="number" min="0" value="'+(r.w||0)+'" oninput="want('+ri+',this.value)"></div></div>'+
'<div class="tw"><table><tr><th>Materiał</th><th>Na 1 szt.</th><th>Mam</th><th>Starczy na</th><th>Brakuje</th></tr>'+rows+'</table></div></div>'});
document.getElementById('v0').innerHTML=h;
S.recipes.forEach((r,ri)=>want(ri,r.w||0,1))}
function want(ri,v,nosave){
var r=S.recipes[ri];r.w=Math.max(0,+v||0);
r.i.forEach(function(g){var el=document.getElementById('m'+ri+'_'+esc(g.n));if(!el)return;
var miss=Math.max(0,(+g.q||0)*r.w-have(g.n));el.innerHTML=r.w?(miss?'<span class="bad">'+miss+'</span>':'<span class="ok">ok</span>'):'–'});
if(!nosave)save()}

function stock(){
var h='<div class="card">';
S.mats.forEach(function(m,i){
h+='<div class="row"><input type="text" value="'+esc(m.n)+'" oninput="S.mats['+i+'].n=this.value;save()"><input type="number" min="0" value="'+m.q+'" oninput="S.mats['+i+'].q=Math.max(0,+this.value||0);save()"><button class="x" onclick="S.mats.splice('+i+',1);save();stock()">×</button></div>'});
if(!S.mats.length)h+='<div class="mu">Magazyn jest pusty.</div>';
h+='<div class="row"><input type="text" id="nm" placeholder="Nowy materiał"><button class="s p" onclick="addMat()">Dodaj</button></div></div>';
document.getElementById('v1').innerHTML=h}
function addMat(){var n=document.getElementById('nm').value;ensure(n);save();stock()}

function recipes(){
var h='';
S.recipes.forEach(function(r,ri){
h+='<div class="card"><div class="row"><input type="text" value="'+esc(r.n)+'" placeholder="Nazwa broni" oninput="S.recipes['+ri+'].n=this.value;save()"><button class="x" title="Usuń broń" onclick="if(confirm(\'Usunąć recepturę?\')){S.recipes.splice('+ri+',1);save();recipes()}">×</button></div>';
r.i.forEach(function(g,gi){
h+='<div class="row"><input type="text" list="dl" value="'+esc(g.n)+'" placeholder="Materiał" onchange="S.recipes['+ri+'].i['+gi+'].n=this.value;ensure(this.value);save();recipes()"><input type="number" min="0" value="'+g.q+'" oninput="S.recipes['+ri+'].i['+gi+'].q=+this.value||0;save()"><button class="x" onclick="S.recipes['+ri+'].i.splice('+gi+',1);save();recipes()">×</button></div>'});
h+='<button class="s" onclick="S.recipes['+ri+'].i.push({n:\'\',q:1});save();recipes()">+ składnik</button></div>'});
h+='<button class="s p" onclick="S.recipes.push({n:\'Nowa broń\',w:0,i:[]});save();recipes()">+ nowa broń</button> <button class="s" onclick="if(confirm(\'Usunąć wszystko, także magazyn?\')){S={mats:[],recipes:[]};save();recipes()}">Wyczyść wszystko</button>';
document.getElementById('v2').innerHTML=h;
document.getElementById('dl').innerHTML=S.mats.map(m=>'<option value="'+esc(m.n)+'">').join('')}
tab(0);
</script>
</body>
</html>
