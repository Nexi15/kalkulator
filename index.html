<style>

:root[data-theme="light"]{--bg:#f3f4f7;--card:#fff;--card2:#eef0f4;--field:#f1f2f6;--tx:#111827;--mu:#6b7280;--bd:rgba(17,24,39,.10);--bd2:rgba(17,24,39,.06);--ac:#f59e0b;--acx:#1c1400;--hi:#b45309;--ok:#059669;--bad:#dc2626;--hov:rgba(17,24,39,.05);--g1:rgba(245,158,11,.14);--g2:rgba(99,102,241,.08);--sh:0 1px 2px rgba(17,24,39,.05),0 16px 36px -26px rgba(17,24,39,.35);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font:15.5px/1.55 var(--body);background:radial-gradient(900px 480px at 8% -8%,var(--g1),transparent 62%),radial-gradient(800px 520px at 100% 0%,var(--g2),transparent 60%),var(--bg);background-attachment:fixed}

button.s{font:600 14px/1.2 var(--body);padding:10px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;transition:background .15s}
button.s:hover{background:var(--hov)}

.tw{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td,th{padding:9px 8px;text-align:left;border-bottom:1px solid var(--bd2);font-variant-numeric:tabular-nums}
th{color:var(--mu);font-weight:500;font-size:12.5px}
td:nth-child(n+2),th:nth-child(n+2){text-align:right;white-space:nowrap}
tr.lim td{background:rgba(251,191,36,.09)}tr.lim td:last-child{color:var(--hi);font-weight:700}

.note{padding:4px 4px 0;font-size:13px}
.bar input{width:100%;box-sizing:border-box;padding:13px 18px;border-radius:999px}
#v1 .card.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));column-gap:28px;padding:10px 20px}

textarea{width:100%;box-sizing:border-box;min-height:160px;margin:10px 0;font:inherit;color:var(--tx);background:var(--field);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;resize:vertical}
ul.log{list-style:none;margin:0;padding:0}
ul.log li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--bd2);font-size:14.5px}

@media (max-width:640px){h1{order:1}.hdr-act{order:2}nav{order:3;flex-basis:100%;overflow-x:auto}nav button{flex:1;white-space:nowrap}.big{font-size:52px}.hd{flex-wrap:wrap}.hd>div:last-child{text-align:left}#v0{grid-template-columns:1fr}}

<script>

var K='craftcalc1';
var SV=3;var PESO='Peso meksykańskie',BP=20000;var VAR={'CUSTOM':['Żelazny gwóźdź','Wygięta żelazna rurka','Metalowa rynna'],'CERAMIK':['Żelazny gwóźdź','Blok silnika','Metalowy kawałek ramy'],'COMBAT':['Śmieć elektroniczny','Śruba','Metalowy kawałek szyny'],'SNS MK2':['Kawałek gumowej podkładki','Kawałek blachy','Metalowa rura'],'VF 1922':['Stare ogrodzenie','Kawałek starej rzeźby','Kawałek metalowej pokrywki',1]};
var WN={'VF 1922':'Vintek VF 1922'};
var SAMPLE=build();
function build(){var rec=[],names={};
 Object.keys(VAR).forEach(function(v){var o=VAR[v],mag='Magazynek '+v,kor='Korpus '+v,luf='Lufa '+v;
  rec.push({n:'Klamka '+(WN[v]||v),t:'w',w:0,i:[{n:mag,q:1},{n:kor,q:1},{n:luf,q:1},{n:'Blueprint '+v,q:1},{n:'Sprężynka',q:2}]});
  rec.push({n:mag,t:'p',i:[{n:'Magazynek',q:1},{n:'Uszkodzone nadkole',q:4},{n:o[0],q:6},{n:'Gumowa uszczelka',q:4},{n:'Część metalowa',q:2}]});
  rec.push({n:kor,t:'p',i:[{n:'Korpus SNS',q:4},{n:'Kawałek stopu metalu',q:3},{n:o[1],q:5},{n:'Kawałek opony',q:2},{n:'Gumowa podkładka',q:2}]});
  rec.push({n:luf,t:'p',i:[{n:'Lufa SNS',q:3},{n:o[2],q:o[3]||2},{n:'Wał od silnika',q:5},{n:'Drzwiczki do sejfu',q:1},{n:'Zardzewiała blacha',q:3}]});
  rec.push({n:'Blueprint '+v,t:'p',b:1,i:[{n:PESO,q:BP}]})});
 rec.forEach(function(r){if(r.t=='p')names[key(r.n)]=r.n;r.i.forEach(function(g){names[key(g.n)]=g.n})});
 var mats=Object.keys(names).map(function(k){return names[k]}).sort(function(a,b){return a.localeCompare(b,'pl')}).map(function(n){return {n:n,q:0}});
 return {v:SV,mats:mats,recipes:rec}}

function initTheme(){
 var th=ls('crafttheme');
 if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);
 updateThemeBtn()}
function toggleTheme(){
 var curTh=document.documentElement.getAttribute('data-theme');
 if(!curTh)curTh=window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
 var next=curTh==='dark'?'light':'dark';
 document.documentElement.setAttribute('data-theme',next);
 ls('crafttheme',next);
 updateThemeBtn()}
function updateThemeBtn(){
 var b=document.getElementById('tbtn');if(!b)return;
 var curTh=document.documentElement.getAttribute('data-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
 b.textContent=curTh==='dark'?'Jasny':'Ciemny'}

var S=load();
function load(){try{var r=localStorage.getItem(K);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.mats)&&Array.isArray(d.recipes)&&!d.recipes.some(function(x){return x.n=='Karabin (przykład)'}))return sync(d)}}catch(e){}return JSON.parse(JSON.stringify(SAMPLE))}
function sync(d){if(d.v===SV)return d;
 SAMPLE.recipes.forEach(function(r){if(!d.recipes.some(function(x){return key(x.n)==key(r.n)}))d.recipes.push(JSON.parse(JSON.stringify(r)))});
 SAMPLE.mats.forEach(function(m){if(!d.mats.some(function(x){return key(x.n)==key(m.n)}))d.mats.push({n:m.n,q:0})});
 d.v=SV;return d}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function key(n){return String(n).trim().toLowerCase()}
function have(n){var k=key(n),t=0;S.mats.forEach(m=>{if(key(m.n)==k)t+=+m.q||0});return t}
function ensure(n){n=String(n).trim();if(!n)return;if(!S.mats.some(m=>key(m.n)==key(n)))S.mats.push({n:n,q:0})}
function find(n){var k=key(n);return S.recipes.find(r=>key(r.n)==k)}
function valid(r){return r&&r.i.some(g=>g.n.trim()&&(+g.q||0)>0)}
function stockMap(){var o={};S.mats.forEach(m=>{var k=key(m.n);o[k]=(o[k]||0)+(+m.q||0)});return o}
function add(o,n,c){var k=key(n);if(!o[k])o[k]={n:n.trim(),c:0};o[k].c+=c}
function resolve(name,n,st,req,pt,d){
 if(n<=0)return;
 var k=key(name),take=Math.min(st[k]||0,n);st[k]=(st[k]||0)-take;n-=take;
 if(n<=0)return;
 var r=find(name);
 if(valid(r)&&d<12){add(pt,name,n);r.i.forEach(g=>{var q=+g.q||0;if(q>0&&g.n.trim())resolve(g.n,n*q,st,req,pt,d+1)})}
 else add(req,name,n)}
function maxN(name){
 if(!valid(find(name)))return have(name);
 function ok(n){var rq={};resolve(name,n,stockMap(),rq,{},0);return !Object.keys(rq).length}
 if(!ok(1))return 0;
 var lo=1,hi=2;
 while(hi<1e6&&ok(hi)){lo=hi;hi*=2}
 if(hi>=1e6&&ok(hi))return hi;
 while(hi-lo>1){var m=Math.floor((lo+hi)/2);if(ok(m))lo=m;else hi=m}
 return lo}
function ren(old,nw){nw=nw.trim();if(!nw)return;var k=key(old);
 S.mats.forEach(m=>{if(key(m.n)==k)m.n=nw});
 S.recipes.forEach(r=>{if(r.t=='p'&&key(r.n)==k)r.n=nw;r.i.forEach(g=>{if(key(g.n)==k)g.n=nw})})}
function dl(){document.getElementById('dl').innerHTML=S.mats.map(m=>'<option value="'+esc(m.n)+'">').join('')}
function tab(i){cur=i;for(var k=0;k<4;k++){document.getElementById('v'+k).hidden=k!=i;document.getElementById('t'+k).className=k==i?'on':''}
 S.recipes.forEach(function(r){if(r.t=='p')ensure(r.n)});
 [sum,stock,recipes,crew][i]();dl()}

function f(n){return Number(n).toLocaleString('pl-PL')}
function price(){var r=S.recipes.find(function(x){return x.b&&valid(x)});return r?(+r.i[0].q||0):0}
function catOf(n){var k=key(n),r=find(n);if(k==key(PESO))return 0;if(r&&r.b)return 1;if(r&&r.t=='p'&&valid(r))return 2;return 3}

function planData(){
 var st=stockMap(),rq={},pt={},n=0;
 S.recipes.forEach(function(r){if(r.t!='p'&&(+r.w||0)>0&&valid(r)){n++;resolve(r.n,r.w,st,rq,pt,0);delete pt[key(r.n)]}});
 return {n:n,st:st,rq:rq,pt:pt}}

function consumePlan(){
 var p=planData();
 if(!p.n||Object.keys(p.rq).length)return;
 if(!confirm('Odjąć zużyte surowce i peso z magazynu zgodnie z tym planem?'))return;
 var before=stockMap();
 S.mats.forEach(function(m){var k=key(m.n);if(p.st[k]!==undefined)m.q=Math.max(0,p.st[k])});
 save();
 S.mats.forEach(function(m){var k=key(m.n),oldQ=before[k]||0,newQ=+m.q||0;
  if(oldQ!==newQ&&SY.ref){var fkKey=fk(m.n);SY.last[fkKey]=newQ;SY.ref.child('stock/'+fkKey).set({n:m.n,q:newQ});logc(m.n,oldQ,newQ)}});
 S.recipes.forEach(function(r){if(r.t!='p')r.w=0});
 save();sum()}

function planHtml(pt,rq,canConsume){
 var buy=[],mk=[],miss=[];
 Object.values(pt).forEach(function(o){var r=find(o.n);if(r&&r.b)buy.push(esc(o.n)+' ×'+o.c+' ('+f(o.c*(+r.i[0].q||0))+' peso)');else mk.push(esc(o.n)+' ×'+o.c)});
 Object.values(rq).forEach(function(o){miss.push(esc(o.n)+' '+f(o.c))});
 var h='';
 if(mk.length)h+='<div><span class="mu">Do zrobienia:</span> '+mk.join(', ')+'</div>';
 if(buy.length)h+='<div><span class="mu">Do kupienia:</span> '+buy.join(', ')+'</div>';
 if(miss.length)h+='<div class="bad">Brakuje: '+miss.join(', ')+'</div>';
 else{h+='<div class="ok">Masz wszystko, możesz robić.</div>';
  if(canConsume)h+='<div class="row" style="margin-top:10px"><button class="s p" onclick="consumePlan()">Odejmij zużyte zasoby z magazynu</button></div>'}
 return h}
function sum(){
 var h='',any=false,pq=have(PESO),pr=price(),empty=!S.mats.some(function(m){return (+m.q||0)>0}),strip='';
 if(empty)strip+='<div class="card hint"><b>Zacznij od magazynu</b><div class="mu">Wpisz, ile czego masz, a tutaj od razu zobaczysz, ile klamek i części możesz zrobić.</div><div class="row"><button class="s p" onclick="tab(1)">Przejdź do magazynu</button></div></div>';
 if(pr)strip+='<div class="strip"><div class="tile"><span class="mu">Peso meksykańskie</span><b>'+f(pq)+'</b></div><div class="tile"><span class="mu">Blueprinty do kupienia</span><b>'+Math.floor(pq/pr)+'</b><span class="mu">po '+f(pr)+' peso, wspólne dla wszystkich klamek</span></div></div>';
 S.recipes.forEach(function(r,ri){
  if(r.t=='p')return;any=true;
  var ok=valid(r),mx=ok?maxN(r.n):0,lim='';
  if(ok){var rq={};resolve(r.n,mx+1,stockMap(),rq,{},0);lim=Object.values(rq).map(function(o){return esc(o.n)}).join(', ')}
  var rows=[],mn=Infinity;
  r.i.forEach(function(g){var q=+g.q||0;if(q<=0||!g.n.trim())return;
   var p2=find(g.n),isP=valid(p2),rd=have(g.n),tot=isP?maxN(g.n):rd,c=Math.floor(tot/q);
   if(c<mn)mn=c;
   rows.push({g:g,q:q,p:p2,isP:isP,rd:rd,ex:isP?tot-rd:0,c:c})});
  var tb='';

  h+='<div class="card w '+(mx>0?'go':'no')+'"><div class="hd"><div><b>'+esc(r.n)+'</b><span class="pill '+(mx>0?'go':'no')+'">'+(mx>0?'Można robić':'Brak materiałów')+'</span><div class="mu">Możesz zrobić</div><div class="big '+(mx>0?'ok':'bad')+'">'+f(mx)+'<small>szt.</small></div>'+
   (lim?'<div class="mu">'+(mx>0?'Ogranicza: ':'Brakuje: ')+lim+'</div>':'')+'</div>'+
   '<div class="want"><div class="mu">Chcę zrobić</div><div class="step"><button class="s" onclick="bump('+ri+',-1)">−</button><input type="number" min="0" id="w'+ri+'" value="'+(r.w||0)+'" oninput="want('+ri+',this.value)"><button class="s" onclick="bump('+ri+',1)">+</button></div></div></div>'+
   '<div id="b'+ri+'" class="plan"></div>'+
   '<div class="tw"><table><tr><th>Składnik</th><th>Masz</th><th>Dorobisz</th><th>Starczy na</th></tr>'+tb+'</table></div></div>'});
 if(!any)h='<div class="card mu">Brak broni. Dodaj je w zakładce Receptury.</div>';

 S.recipes=JSON.parse(JSON.stringify(SAMPLE.recipes));SAMPLE.mats.forEach(function(m){ensure(m.n)});save();recipes()}

function applyFlt(){
 var inp=document.getElementById('srch'),k=key(inp?inp.value:'');
 var p=planData(),missSet={};

function stock(){
 var cats=[[],[],[],[]],names=['Waluta','Blueprinty','Gotowe części','Surowce'];
 S.mats.forEach(function(m,i){cats[catOf(m.n)].push(i)});
 var h='<div class="bar"><input type="search" id="srch" placeholder="Szukaj w magazynie…" oninput="applyFlt()"><div class="fbar"><button class="fbtn '+(fltMode==='all'?'on':'')+'" data-f="all" onclick="setFlt(\'all\')">Wszystkie</button><button class="fbtn '+(fltMode==='pos'?'on':'')+'" data-f="pos" onclick="setFlt(\'pos\')">Mam &gt; 0</button><button class="fbtn '+(fltMode==='miss'?'on':'')+'" data-f="miss" onclick="setFlt(\'miss\')">Brakuje do planu</button></div></div>';
 cats.forEach(function(ix,c){if(!ix.length)return;
  h+='<h3>'+names[c]+(c==0&&price()?'<span class="mu">1 blueprint = '+f(price())+' peso</span>':'')+'</h3><div class="card list">';
  ix.forEach(function(i){var m=S.mats[i],st=c==0?10000:1;
   h+='<div class="row it" data-n="'+esc(m.n)+'" data-q="'+(+m.q||0)+'"><input type="text" class="nm" value="'+esc(m.n)+'"'+(SY.ref?' readonly':'')+' onchange="renByKey(\''+esc(key(m.n))+'\',this.value);save();stock();dl()"><div class="step"><button class="s" onclick="adj('+i+',-'+st+')">−</button><input type="number" min="0" id="q'+i+'" value="'+m.q+'" oninput="qset('+i+',Math.max(0,+this.value||0))"><button class="s" onclick="adj('+i+','+st+')">+</button></div><button class="x" title="Usuń" onclick="delMat('+i+')">×</button></div>'});
  h+='</div>'});
 if(!S.mats.length)h+='<div class="card mu">Magazyn jest pusty.</div>';
 h+='<h3>Dodaj pozycję</h3><div class="card"><div class="row"><input type="text" id="nm" placeholder="Nazwa materiału lub części"><button class="s p" onclick="addMat(document.getElementById(\'nm\').value)">Dodaj</button></div></div>';
 h+='<h3>Kopiuj i wklej magazyn</h3><div class="card io"><div class="mu">Skopiuj stan magazynu jako tekst, a po zmianach wklej go z powrotem. Format: jedna linia na pozycję, np. Żelazo: 20</div><textarea id="io" placeholder="Żelazo: 20&#10;Stal: 5"></textarea><div class="row"><button class="s p" onclick="exp()">Skopiuj magazyn</button><button class="s" onclick="imp()">Wczytaj z pola</button></div><div class="mu" id="iomsg"></div></div>';
 document.getElementById('v1').innerHTML=h;
 applyFlt()}
function renByKey(k,nw){var m=S.mats.find(function(x){return key(x.n)===k});if(m)ren(m.n,nw)}
function exp(){var t=S.mats.map(function(m){return m.n+': '+(+m.q||0)}).join('\n'),el=document.getElementById('io'),ms=document.getElementById('iomsg');
 el.value=t;el.select();
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){ms.textContent='Skopiowano do schowka ('+S.mats.length+' pozycji).'},function(){ms.textContent='Tekst zaznaczony, skopiuj go ręcznie (Ctrl+C).'});
 else ms.textContent='Tekst zaznaczony, skopiuj go ręcznie (Ctrl+C).'}
function imp(){var el=document.getElementById('io'),n=0;
 el.value.split(/\r?\n/).forEach(function(l){var m=l.match(/^\s*(.+?)\s*[:=]\s*(\d+)\s*$/);if(!m)return;
  ensure(m[1]);S.mats.forEach(function(x){if(key(x.n)==key(m[1]))x.q=+m[2]});n++});
 if(!n){document.getElementById('iomsg').textContent='Nie rozpoznano żadnych linii. Format: Nazwa: ilość';return}
 save();syncAll();stock();document.getElementById('iomsg').textContent='Wczytano '+n+' pozycji.'}
function card(r,ri){
 var h='<div class="card"><div class="row"><input type="text" value="'+esc(r.n)+'" placeholder="Nazwa" onchange="rn('+ri+',this.value)"><button class="x" onclick="if(confirm(\'Usunąć recepturę?\')){S.recipes.splice('+ri+',1);save();recipes()}">×</button></div>';
 r.i.forEach(function(g,gi){
  h+='<div class="row"><input type="text" list="dl" value="'+esc(g.n)+'" placeholder="Materiał lub część" onchange="S.recipes['+ri+'].i['+gi+'].n=this.value;ensure(this.value);save();recipes()"><input type="number" min="0" value="'+g.q+'" oninput="S.recipes['+ri+'].i['+gi+'].q=+this.value||0;save()"><button class="x" onclick="S.recipes['+ri+'].i.splice('+gi+',1);save();recipes()">×</button></div>'});
 return h+'<button class="s" onclick="S.recipes['+ri+'].i.push({n:\'\',q:1});save();recipes()">+ składnik</button></div>'}
function rn(ri,v){var r=S.recipes[ri];if(!v.trim())return recipes();if(r.t=='p'){ren(r.n,v);ensure(r.n)}else r.n=v;save();recipes()}
function recipes(){
 var shown={},h='';
 function sub(r,d){var o='';
  r.i.forEach(function(g){var pr=find(g.n);
   if(pr&&pr.t=='p'&&valid(pr)&&!shown[key(pr.n)]&&d<8){shown[key(pr.n)]=1;o+=card(pr,S.recipes.indexOf(pr))+sub(pr,d+1)}});
  return o}
 S.recipes.forEach(function(r,ri){if(r.t=='p')return;
  h+='<h2>'+esc(r.n)+'</h2>'+card(r,ri);
  var s=sub(r,0);
  if(s)h+='<div style="margin-left:12px;padding-left:10px;border-left:3px solid var(--bd)"><div class="mu" style="margin-bottom:6px">Części do złożenia: '+esc(r.n)+'</div>'+s+'</div>'});
 var rest='';
 S.recipes.forEach(function(r,ri){if(r.t=='p'&&!shown[key(r.n)])rest+=card(r,ri)});
 if(rest)h+='<h2>Pozostałe części (nie użyte w żadnej broni)</h2>'+rest;
 h+='<h2>Dodaj</h2><button class="s p" onclick="S.recipes.push({n:\'Nowa broń\',t:\'w\',w:0,i:[]});save();recipes()">+ nowa broń</button> '+
 '<button class="s p" onclick="S.recipes.push({n:\'Nowa część\',t:\'p\',i:[]});ensure(\'Nowa część\');save();recipes()">+ nowa część</button>'+
 '<h2>Dane</h2><button class="s" onclick="loadDef()">Wczytaj receptury z gry</button> '+
 '<button class="s" onclick="if(confirm(\'Usunąć wszystko, także magazyn?\')){S={v:SV,mats:[],recipes:[]};save();recipes()}">Wyczyść wszystko</button>';
 document.getElementById('v2').innerHTML=h;
 dl()}
var cur=0;
var SY={db:null,ref:null,lq:null,room:'',nick:'',last:{},pend:{},tm:{},log:[],conn:false,seeded:false,cb:false};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return ''}
function fk(n){return encodeURIComponent(key(n)).replace(/\./g,'%2E')}
function isUsed(n){var k=key(n);return S.recipes.some(function(r){return key(r.n)==k||r.i.some(function(g){return key(g.n)==k})})}
function chip(){var e=document.getElementById('chip');if(!e)return;var c='',t;
 if(!window.firebase||!FBCFG.databaseURL)t='Tryb lokalny';else if(!SY.ref)t='Bez ekipy';else if(SY.conn){c='on';t='Ekipa: '+esc(SY.room)}else{c='err';t='Łączenie…'}
 e.innerHTML='<i class="dot '+c+'"></i>'+t}
function initSync(){
 chip();
 if(!window.firebase||!FBCFG.databaseURL)return;
 try{if(!firebase.apps.length)firebase.initializeApp(FBCFG);SY.db=firebase.database()}catch(e){return}
 var u='';try{u=new URLSearchParams(location.search).get('room')||''}catch(e){}
 SY.nick=ls('craftnick');
 var r=(u||ls('craftroom')).toLowerCase();
 if(/^[a-z0-9_-]{6,40}$/.test(r)){
  if(u&&!SY.nick){var n='';try{n=prompt('Jak masz na imię? (pokaże się w historii zmian)')||''}catch(e){}SY.nick=n.trim()||'Gracz';ls('craftnick',SY.nick)}
  join(r)}}
function join(r){
 leaveRef();
 SY.room=r;ls('craftroom',r);SY.ref=SY.db.ref('rooms/'+r);SY.seeded=false;SY.last={};SY.pend={};SY.log=[];
 SY.ref.child('stock').on('value',onStock,function(){SY.conn=false;chip()});
 SY.lq=SY.ref.child('log').limitToLast(20);SY.lq.on('value',onLog);
 if(!SY.cb){SY.cb=true;SY.db.ref('.info/connected').on('value',function(s){SY.conn=!!s.val();chip();var m=document.getElementById('cmsg');if(m)m.textContent=statusText()})}
 chip()}
function leaveRef(){if(SY.ref){SY.ref.child('stock').off();if(SY.lq)SY.lq.off()}}
function leave(){leaveRef();SY.ref=null;SY.lq=null;SY.room='';SY.seeded=false;ls('craftroom',null);chip();crew()}
function onStock(snap){
 var v=snap.val()||{},ks=Object.keys(v);
 if(!SY.seeded){SY.seeded=true;
  if(!ks.length){var up={},c=0;S.mats.forEach(function(m){if((+m.q||0)>0){up[fk(m.n)]={n:m.n,q:+m.q};SY.last[fk(m.n)]=+m.q;c++}});if(c)SY.ref.child('stock').update(up);return}}
 SY.last={};var seen={};
 ks.forEach(function(k){var it=v[k]||{},nm=it.n||k,q=Math.max(0,+it.q||0);seen[k]=1;SY.last[k]=q;
  if(SY.pend[k])return;
  var m=S.mats.find(function(x){return key(x.n)==key(nm)});if(m)m.q=q;else S.mats.push({n:nm,q:q})});
 S.mats.forEach(function(m){var k=fk(m.n);if(!seen[k]&&!SY.pend[k])m.q=0});
 S.mats=S.mats.filter(function(m){return seen[fk(m.n)]||isUsed(m.n)});
 save();refresh()}
function onLog(snap){var v=snap.val()||{};
 SY.log=Object.keys(v).map(function(k){return v[k]}).sort(function(a,b){return (b.t||0)-(a.t||0)}).slice(0,20);
 var e=document.getElementById('logl');if(e&&cur==3)e.innerHTML=logHtml()}
function refresh(){
 var a=document.activeElement,id=a&&a.id,pos=null;try{pos=a&&a.selectionStart}catch(e){}
 if(cur==0)sum();
 else if(cur==1){var n=document.querySelectorAll('#v1 input[id^="q"]').length;
  if(n!=S.mats.length)stock();else S.mats.forEach(function(m,i){var e=document.getElementById('q'+i);if(e&&e!==a)e.value=m.q})}
 if((cur==0||cur==1)&&id){var e2=document.getElementById(id);if(e2&&e2.focus){e2.focus();try{if(pos!=null)e2.setSelectionRange(pos,pos)}catch(x){}}}}
function logc(name,a,b){if(!SY.ref||!window.firebase)return;
 SY.ref.child('log').push({u:SY.nick||'Gracz',t:firebase.database.ServerValue.TIMESTAMP,m:name,a:a,b:b})}
function qset(i,v){var m=S.mats[i];m.q=v;save();if(!SY.ref)return;
 var k=fk(m.n);SY.pend[k]=1;clearTimeout(SY.tm[k]);
 SY.tm[k]=setTimeout(function(){delete SY.pend[k];var old=SY.last[k]||0;if(old===m.q)return;SY.last[k]=m.q;SY.ref.child('stock/'+k).set({n:m.n,q:m.q});logc(m.n,old,m.q)},500)}
function adj(i,d){var m=S.mats[i];m.q=Math.max(0,(+m.q||0)+d);var el=document.getElementById('q'+i);if(el)el.value=m.q;save();
 if(!SY.ref)return;var k=fk(m.n),nm=m.n;
 SY.ref.child('stock/'+k).transaction(function(c){c=c||{n:nm,q:SY.last[k]||0};c.n=nm;c.q=Math.max(0,(+c.q||0)+d);return c},
  function(err,ok,snap){if(ok&&snap&&snap.val()){var nq=snap.val().q;logc(nm,Math.max(0,nq-d),nq)}})}
function delMat(i){var m=S.mats[i];if(SY.ref){var k=fk(m.n);SY.ref.child('stock/'+k).remove();delete SY.last[k]}S.mats.splice(i,1);save();stock()}
function addMat(n){n=String(n).trim();if(!n)return;ensure(n);save();
 if(SY.ref){var k=fk(n);if(SY.last[k]==null){SY.last[k]=0;SY.ref.child('stock/'+k).set({n:n,q:0})}}stock()}
function syncAll(){if(!SY.ref)return;var up={},c=0;
 S.mats.forEach(function(m){var k=fk(m.n),q=+m.q||0;if((SY.last[k]||0)!==q){up[k]={n:m.n,q:q};logc(m.n,SY.last[k]||0,q);SY.last[k]=q;c++}});
 if(c)SY.ref.child('stock').update(up)}
function statusText(){return SY.ref?(SY.conn?'Połączono. Zmiany magazynu są wspólne i widać je od razu.':'Łączenie…'):'Niepołączono. Magazyn jest tylko na tym urządzeniu.'}
function rnd(){var c='abcdefghjkmnpqrstuvwxyz23456789',s='',a=new Uint8Array(10);try{crypto.getRandomValues(a)}catch(e){for(var i=0;i<10;i++)a[i]=Math.random()*256}for(var j=0;j<10;j++)s+=c[a[j]%c.length];return s}
function invite(){return location.href.split('#')[0].split('?')[0]+'?room='+SY.room}
function copyInv(){var e=document.getElementById('inv');e.select();try{navigator.clipboard.writeText(e.value)}catch(x){}document.getElementById('cmsg').textContent='Link skopiowany. Wyślij go ekipie.'}
function connectRoom(){var r=document.getElementById('rm').value.trim().toLowerCase(),n=document.getElementById('nk').value.trim(),m=document.getElementById('cmsg');
 if(!/^[a-z0-9_-]{6,40}$/.test(r)){m.textContent='Kod ekipy: 6 do 40 znaków (małe litery, cyfry, - i _).';return}
 SY.nick=n||'Gracz';ls('craftnick',SY.nick);join(r);crew()}
function tm(t){return t?new Date(t).toLocaleString('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}
function logHtml(){return SY.log.length?SY.log.map(function(e){return '<li><span><b>'+esc(e.u||'?')+'</b> '+esc(e.m||'')+': '+f(e.a||0)+' → '+f(e.b||0)+'</span><span class="mu">'+tm(e.t)+'</span></li>'}).join(''):'<li class="mu">Brak zmian.</li>'}
function crew(){
 var h='';
 if(!window.firebase)h='<div class="card"><b>Wspólny magazyn niedostępny w tej wersji</b><div class="mu">Ta strona nie może tu połączyć się z Firebase (np. w podglądzie). Po wrzuceniu na GitHub Pages zadziała.</div></div>';
 else if(!FBCFG.databaseURL)h='<div class="card"><b>Wspólny magazyn nie jest jeszcze skonfigurowany</b><div class="mu">W pliku index.html wklej konfigurację Firebase w miejscu FBCFG. Do tego czasu strona działa lokalnie, tylko na tym urządzeniu.</div></div>';
 else{
  h='<div class="card"><b>Ekipa</b><div class="mu">Wszyscy z tym samym kodem widzą i zmieniają ten sam magazyn na żywo.</div>'+
   '<div class="row"><input type="text" id="rm" placeholder="Kod ekipy (min. 6 znaków)" value="'+esc(SY.room)+'"><button class="s" onclick="document.getElementById(\'rm\').value=rnd()">Losuj</button></div>'+
   '<div class="row"><input type="text" id="nk" placeholder="Twój nick" value="'+esc(SY.nick)+'"><button class="s p" onclick="connectRoom()">'+(SY.ref?'Zmień':'Połącz')+'</button>'+(SY.ref?'<button class="s" onclick="leave()">Rozłącz</button>':'')+'</div>'+
   '<div class="mu" id="cmsg">'+statusText()+'</div>'+
   (SY.ref?'<div class="row"><input type="text" id="inv" readonly value="'+esc(invite())+'"><button class="s" onclick="copyInv()">Kopiuj link</button></div>':'')+'</div>';
  if(SY.ref)h+='<h3>Ostatnie zmiany</h3><div class="card"><ul class="log" id="logl">'+logHtml()+'</ul></div>';
  h+='<div class="note mu">Po połączeniu Twój magazyn zostaje zastąpiony wspólnym (jeśli ekipa już coś w nim ma). Wspólny jest tylko magazyn. Receptury masz lokalnie, a zmiany w przepisach dla wszystkich wprowadza się w pliku strony.</div>'}
 document.getElementById('v3').innerHTML=h}
initTheme();initSync();tab(0);
